name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LOOM_GUIDE_DIR: ${{ github.workspace }}/crates/cli/fixtures/ci-runtime-content/loom-guide
      LOOM_SKILLS_DIR: ${{ github.workspace }}/crates/cli/fixtures/ci-runtime-content/loom-skills
      LOOM_ACTOR_CIRCUIT_DIR: ${{ github.workspace }}/crates/cli/fixtures/ci-runtime-content/actor-circuit
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Validate CI runtime content fixture
        shell: bash
        run: |
          test -f crates/cli/fixtures/ci-runtime-content/loom-guide/guides/runtime-awareness.md
          test -f crates/cli/fixtures/ci-runtime-content/loom-skills/skills/loom/SKILL.md
          test -f crates/cli/fixtures/ci-runtime-content/actor-circuit/skills/actor-circuit/SKILL.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test

      - name: Build smoke binaries
        run: cargo build

      - name: E2E smoke
        # E2E scripts use bash + /tmp + python3 idioms that are Linux-only.
        # Windows/macOS runners don't reliably provide all three.
        if: runner.os == 'Linux'
        run: bash scripts/e2e/run-all.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/gui-web lint

      - name: Build
        run: pnpm --dir apps/gui-web build

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release versions
        run: node scripts/check-release-version.mjs

      - name: Check shell packaging script syntax
        run: bash -n scripts/package-release.sh

      - name: Check release metadata script syntax
        run: node --check scripts/write-release-downloads.mjs

      - name: Test release preview automation
        run: node --test scripts/tests/release-preview.test.mjs

      - name: Test release packaging scripts
        run: bash scripts/tests/release-scripts.test.sh

      - name: Build Pages portal
        run: bash pages/build.sh
