name: GUI Build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "crates/gui/**"
      - "crates/loom-shell/**"
      - "crates/proto/**"
      - "apps/gui-web/**"
      - ".github/workflows/gui-build.yml"
  pull_request:
    paths:
      - "crates/gui/**"
      - "crates/loom-shell/**"
      - "crates/proto/**"
      - "apps/gui-web/**"
      - ".github/workflows/gui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  # ── Linux GUI build ────────────────────────────────────────────────────
  gui-linux:
    name: GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Check loom-gui (Tauri)
        run: cargo check -p loom-gui

      - name: Build loom-gui
        run: cargo build -p loom-gui

      - name: Check loom-shell
        run: cargo check -p loom-shell

  # ── macOS GUI build ────────────────────────────────────────────────────
  gui-macos:
    name: GUI (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check loom-gui (Tauri)
        run: cargo check -p loom-gui

      - name: Build loom-gui
        run: cargo build -p loom-gui

      - name: Check loom-shell
        run: cargo check -p loom-shell

  # ── Windows GUI build ──────────────────────────────────────────────────
  gui-windows:
    name: GUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check loom-gui (Tauri)
        run: cargo check -p loom-gui

      - name: Check loom-shell
        run: cargo check -p loom-shell

      - name: Build loom-gui
        run: cargo build -p loom-gui

      - name: Build loom-shell
        run: cargo build -p loom-shell

      - name: Upload loom-shell artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: loom-shell-windows
          path: target/debug/loom-shell.exe
          retention-days: 30
          if-no-files-found: error

  # ── Frontend web build ─────────────────────────────────────────────────
  gui-frontend:
    name: GUI Frontend (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gui-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Upload frontend dist (for bundle jobs)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: apps/gui-web/dist
          retention-days: 7
          if-no-files-found: error

  # ── Linux GUI bundle (tag / workflow_dispatch only) ────────────────────
  gui-bundle-linux:
    name: GUI Bundle (Linux)
    runs-on: ubuntu-latest
    needs: [gui-frontend, gui-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libfuse2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        run: cd crates/gui && cargo tauri build --ci --bundles deb,appimage

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-bundle-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 90
          if-no-files-found: error

  # ── macOS GUI bundle (tag / workflow_dispatch only) ────────────────────
  gui-bundle-macos:
    name: GUI Bundle (macOS)
    runs-on: macos-latest
    needs: [gui-frontend, gui-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        run: cd crates/gui && cargo tauri build --ci --bundles dmg

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-bundle-macos
          path: target/release/bundle/dmg/*.dmg
          retention-days: 90
          if-no-files-found: error

  # ── Windows GUI bundle (tag / workflow_dispatch only) ──────────────────
  gui-bundle-windows:
    name: GUI Bundle (Windows)
    runs-on: windows-latest
    needs: [gui-frontend, gui-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        run: cd crates/gui && cargo tauri build --ci --bundles nsis

      - name: Build loom-shell
        run: cargo build -p loom-shell --release

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gui-bundle-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/loom-shell.exe
          retention-days: 90
          if-no-files-found: error

  # ── Summary ────────────────────────────────────────────────────────────
  gui-summary:
    name: GUI Build Summary
    runs-on: ubuntu-latest
    needs:
      - gui-linux
      - gui-macos
      - gui-windows
      - gui-frontend
      - gui-bundle-linux
      - gui-bundle-macos
      - gui-bundle-windows
    if: always()
    steps:
      - name: Report results
        run: |
          echo "## GUI Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GUI (Linux)         | ${{ needs.gui-linux.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GUI (macOS)         | ${{ needs.gui-macos.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GUI (Windows)       | ${{ needs.gui-windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend            | ${{ needs.gui-frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle (Linux)      | ${{ needs.gui-bundle-linux.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle (macOS)      | ${{ needs.gui-bundle-macos.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bundle (Windows)    | ${{ needs.gui-bundle-windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
