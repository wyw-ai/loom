name: Release preview rollover

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-preview-rollover
  cancel-in-progress: false

jobs:
  rollover:
    name: Ensure next release preview
    runs-on: ubuntu-latest
    steps:
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.LOOM_RELEASE_APP_ID }}
          private-key: ${{ secrets.LOOM_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure authenticated Git access
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Verify rollover trigger
        id: trigger
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Manual recovery run requested."
            exit 0
          fi

          prs_file="$RUNNER_TEMP/associated-prs.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > "$prs_file"
          merged_preview="$(node - "$prs_file" <<'NODE'
          const fs = require("node:fs");
          const prs = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const matches = prs.filter((pr) =>
            pr.merged_at &&
            pr.base?.ref === "main" &&
            /^preview-[0-9]+\.[0-9]+\.[0-9]+$/.test(pr.head?.ref || ""),
          );
          process.stdout.write(matches.at(-1)?.head?.ref || "");
          NODE
          )"

          if [[ -z "$merged_preview" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "The main push was not produced by merging a preview-X.Y.Z pull request."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "merged-preview=$merged_preview" >> "$GITHUB_OUTPUT"
          echo "Detected merged release preview: $merged_preview"

      - name: Plan next 0.x release preview
        if: steps.trigger.outputs.eligible == 'true'
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          current_version="$(node scripts/check-release-version.mjs --print-version)"
          merged_preview="${{ steps.trigger.outputs.merged-preview }}"
          if [[ -n "$merged_preview" && "$merged_preview" != "preview-$current_version" ]]; then
            echo "::error::Merged branch $merged_preview does not match main version $current_version."
            exit 1
          fi

          branches_file="$RUNNER_TEMP/preview-branches.txt"
          tags_file="$RUNNER_TEMP/release-tags.txt"
          git ls-remote --heads origin "refs/heads/preview-*" \
            | sed 's#^.*refs/heads/##' > "$branches_file"
          git ls-remote --tags --refs origin "refs/tags/v*" \
            | sed 's#^.*refs/tags/##' > "$tags_file"

          plan="$(node scripts/plan-release-preview.mjs \
            --current "$current_version" \
            --branches-file "$branches_file" \
            --tags-file "$tags_file")"
          action="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).action)' "$plan")"
          branch="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).branch)' "$plan")"
          version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$plan")"

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          echo "Rollover plan: $plan"

      - name: Validate reused preview branch
        if: steps.trigger.outputs.eligible == 'true' && steps.plan.outputs.action == 'reuse'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW_BRANCH: ${{ steps.plan.outputs.branch }}
          PREVIEW_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail

          git fetch origin \
            "refs/heads/$PREVIEW_BRANCH:refs/remotes/origin/$PREVIEW_BRANCH"
          candidate_version="$(git show "origin/$PREVIEW_BRANCH:Cargo.toml" \
            | node -e '
                let source = "";
                process.stdin.on("data", (chunk) => { source += chunk; });
                process.stdin.on("end", () => {
                  const section = source
                    .split(/\r?\n(?=\[)/)
                    .find((part) => part.trimStart().startsWith("[workspace.package]"));
                  const version = section?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
                  if (!version) process.exit(1);
                  process.stdout.write(version);
                });
              ')"
          if [[ "$candidate_version" != "$PREVIEW_VERSION" ]]; then
            echo "::error::$PREVIEW_BRANCH contains version $candidate_version, expected $PREVIEW_VERSION."
            exit 1
          fi

      - name: Create versioned preview branch
        if: steps.trigger.outputs.eligible == 'true' && steps.plan.outputs.action == 'create'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW_BRANCH: ${{ steps.plan.outputs.branch }}
          PREVIEW_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$PREVIEW_BRANCH" origin/main
          node scripts/set-release-version.mjs "$PREVIEW_VERSION"
          node scripts/check-release-version.mjs "v$PREVIEW_VERSION"
          git diff --check
          git add \
            Cargo.toml \
            Cargo.lock \
            apps/gui-web/package.json \
            crates/gui/tauri.conf.json \
            pages/portal/release-downloads.js
          git commit -m "chore(release): prepare v$PREVIEW_VERSION"
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"

      - name: Ensure pull request to main
        if: steps.trigger.outputs.eligible == 'true'
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREVIEW_BRANCH: ${{ steps.plan.outputs.branch }}
          PREVIEW_VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.plan.outputs.current-version }}
        run: |
          set -euo pipefail

          existing_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PREVIEW_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // ""')"
          if [[ -n "$existing_url" ]]; then
            echo "url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "Using existing pull request: $existing_url"
            exit 0
          fi

          body_file="$RUNNER_TEMP/release-preview-pr.md"
          printf '%s\n' \
            '## Release preview' \
            '' \
            "This PR was created automatically after v$PREVIOUS_VERSION reached \`main\`." \
            '' \
            "- Candidate branch: \`$PREVIEW_BRANCH\`" \
            "- Candidate version: \`$PREVIEW_VERSION\`" \
            '- Human gate: review the checks, then merge when this candidate is ready.' \
            '- Rollover: merging this PR will ensure the next minor preview exists.' \
            > "$body_file"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PREVIEW_BRANCH" \
            --title "chore(release): preview $PREVIEW_VERSION" \
            --body-file "$body_file")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created pull request: $pr_url"

      - name: Write workflow summary
        if: steps.trigger.outputs.eligible == 'true'
        shell: bash
        env:
          PREVIEW_ACTION: ${{ steps.plan.outputs.action }}
          PREVIEW_BRANCH: ${{ steps.plan.outputs.branch }}
          PREVIEW_VERSION: ${{ steps.plan.outputs.version }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          printf '%s\n' \
            '## Release preview rollover' \
            '' \
            "- Action: \`$PREVIEW_ACTION\`" \
            "- Branch: \`$PREVIEW_BRANCH\`" \
            "- Version: \`$PREVIEW_VERSION\`" \
            "- Pull request: $PR_URL" \
            >> "$GITHUB_STEP_SUMMARY"
