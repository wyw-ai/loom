name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, for example v0.1.0.
        required: true
        type: string
      publish:
        description: Upload GitHub Release assets and deploy Pages.
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      download_base_url: ${{ steps.meta.outputs.download_base_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Check versions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            publish="${{ inputs.publish }}"
          else
            tag="${GITHUB_REF_NAME}"
            publish="true"
          fi

          node scripts/check-release-version.mjs "$tag"
          version="$(node scripts/check-release-version.mjs "$tag" --print-version)"

          if [[ "$tag" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "publish=$publish"
            echo "download_base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Linux runtime
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --locked

      - name: Build Linux release binaries
        run: make linux-x86-release LINUX_BUILDER=cross

      - name: Archive Linux dist
        run: tar -czf linux-dist.tar.gz -C dist release

      - name: Upload Linux dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-dist
          path: linux-dist.tar.gz
          if-no-files-found: error

  macos:
    name: macOS runtime
    runs-on: macos-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build macOS release binaries
        run: make mac-universal-release

      - name: Archive macOS dist
        run: tar -czf macos-dist.tar.gz -C dist release

      - name: Upload macOS dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dist
          path: macos-dist.tar.gz
          if-no-files-found: error

  package:
    name: Package and upload
    runs-on: macos-latest
    needs:
      - version
      - linux
      - macos
    outputs:
      publish: ${{ needs.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download Linux dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: linux-dist
          path: artifacts/linux

      - name: Download macOS dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-dist
          path: artifacts/macos

      - name: Restore dist tree
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xzf artifacts/linux/linux-dist.tar.gz -C dist
          tar -xzf artifacts/macos/macos-dist.tar.gz -C dist

      - name: Package release artifacts
        env:
          DOWNLOAD_BASE_URL: ${{ needs.version.outputs.download_base_url }}
        run: bash scripts/package-release.sh --skip-build

      - name: Generate Pages release metadata
        env:
          DOWNLOAD_BASE_URL: ${{ needs.version.outputs.download_base_url }}
        run: |
          node scripts/write-release-downloads.mjs \
            --package-dir dist/packages \
            --out pages/portal/release-downloads.js \
            --version "${{ needs.version.outputs.version }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --git-sha "${GITHUB_SHA}" \
            --group "${{ needs.version.outputs.tag }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: dist/packages
          if-no-files-found: error

      - name: Build Pages portal
        run: bash pages/build.sh

      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-build
          path: pages/build
          if-no-files-found: error

      - name: Upload GitHub Release assets
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/packages/* --clobber
          else
            gh release create "$TAG_NAME" dist/packages/* \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              "${flags[@]}"
          fi

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs:
      - version
      - package
    if: needs.version.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Pages build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: pages-build
          path: pages/build

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages/build

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
