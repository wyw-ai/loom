name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package, for example v0.1.1.
        required: true
        type: string
      publish:
        description: Upload GitHub Release assets and deploy Pages.
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  version:
    name: Version gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      download_base_url: ${{ steps.meta.outputs.download_base_url }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check versions
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            publish="$INPUT_PUBLISH"
          else
            tag="${GITHUB_REF_NAME}"
            publish="true"
          fi

          node scripts/check-release-version.mjs "$tag"
          version="$(node scripts/check-release-version.mjs "$tag" --print-version)"
          source_sha="$(git rev-parse HEAD)"
          source_ref="$GITHUB_REF"

          if [[ "$publish" == "true" ]]; then
            source_ref="refs/tags/$tag"
            if ! git show-ref --verify --quiet "$source_ref"; then
              echo "::error::Publishing requires an existing tag: $source_ref"
              exit 1
            fi

            tag_sha="$(git rev-list -n 1 "$source_ref")"
            if [[ "$tag_sha" != "$source_sha" ]]; then
              echo "::error::Checked-out commit $source_sha does not match $source_ref ($tag_sha)."
              exit 1
            fi

            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main; then
              echo "::error::Release tag $tag must point to a commit contained in main."
              exit 1
            fi
          fi

          if [[ "$tag" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "publish=$publish"
            echo "download_base_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
            echo "source_ref=$source_ref"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Linux runtime
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: Checkout official Loom guide content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/loom-guide
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-guide

      - name: Checkout official Loom skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/skills
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-skills

      - name: Checkout official actor-circuit skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/actor-circuit
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: actor-circuit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --locked

      - name: Build Linux release binaries
        run: make linux-x86-gnu-release linux-x86-release LINUX_BUILDER=cross

      - name: Archive Linux dist
        run: tar -czf linux-dist.tar.gz -C dist release

      - name: Upload Linux dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-dist
          path: linux-dist.tar.gz
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS runtime
    runs-on: macos-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: Checkout official Loom guide content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/loom-guide
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-guide

      - name: Checkout official Loom skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/skills
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-skills

      - name: Checkout official actor-circuit skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/actor-circuit
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: actor-circuit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build macOS release binaries
        run: make mac-universal-release

      - name: Archive macOS dist
        run: tar -czf macos-dist.tar.gz -C dist release

      - name: Upload macOS dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dist
          path: macos-dist.tar.gz
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows runtime
    runs-on: windows-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: Checkout official Loom guide content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/loom-guide
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-guide

      - name: Checkout official Loom skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/skills
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: loom-skills

      - name: Checkout official actor-circuit skills content
        uses: actions/checkout@v6.0.3
        with:
          repository: wyw-ai/actor-circuit
          token: ${{ secrets.LOOM_CONTENT_TOKEN || github.token }}
          path: actor-circuit

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-pc-windows-msvc -p loom-cli -p loom-server
          cargo build --release --target x86_64-pc-windows-msvc -p loom-shell
          mkdir -p dist/release/x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/loom.exe        dist/release/x86_64-pc-windows-msvc/loom.exe
          cp target/x86_64-pc-windows-msvc/release/loom-daemon.exe dist/release/x86_64-pc-windows-msvc/loom-daemon.exe
          cp target/x86_64-pc-windows-msvc/release/loom-server.exe dist/release/x86_64-pc-windows-msvc/loom-server.exe
          cp target/x86_64-pc-windows-msvc/release/loom-shell.exe  dist/release/x86_64-pc-windows-msvc/loom-shell.exe

      - name: Download winsw
        shell: bash
        run: |
          set -euo pipefail
          WINSW_VERSION="$(cat .winsw-version)"
          WINSW_URL="https://github.com/winsw/winsw/releases/download/${WINSW_VERSION}/WinSW-x64.exe"
          curl -fsSL "$WINSW_URL" -o dist/release/x86_64-pc-windows-msvc/WinSW-x64.exe

      - name: Copy Windows Service config and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release/x86_64-pc-windows-msvc/config
          cp scripts/windows/loom-server.xml  dist/release/x86_64-pc-windows-msvc/config/
          cp scripts/windows/loom-daemon.xml  dist/release/x86_64-pc-windows-msvc/config/
          cp scripts/windows/install.ps1      dist/release/x86_64-pc-windows-msvc/
          cp scripts/windows/uninstall.ps1    dist/release/x86_64-pc-windows-msvc/

      - name: Archive Windows dist
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release/x86_64-pc-windows-msvc
          7z a -tzip ../../../windows-dist.zip .

      - name: Upload Windows dist
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-dist
          path: windows-dist.zip
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package and upload
    runs-on: macos-latest
    needs:
      - version
      - linux
      - macos
      - windows
    outputs:
      publish: ${{ needs.version.outputs.publish }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/gui-web install --frozen-lockfile

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Download Linux dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: linux-dist
          path: artifacts/linux

      - name: Download macOS dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: macos-dist
          path: artifacts/macos

      - name: Download Windows dist
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-dist
          path: artifacts/windows

      - name: Restore dist tree
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xzf artifacts/linux/linux-dist.tar.gz -C dist
          tar -xzf artifacts/macos/macos-dist.tar.gz -C dist
          unzip -o artifacts/windows/windows-dist.zip -d dist/release/x86_64-pc-windows-msvc

      - name: Package release artifacts
        env:
          DOWNLOAD_BASE_URL: ${{ needs.version.outputs.download_base_url }}
        run: bash scripts/package-release.sh --skip-build

      - name: Generate Pages release metadata
        env:
          DOWNLOAD_BASE_URL: ${{ needs.version.outputs.download_base_url }}
        run: |
          node scripts/write-release-downloads.mjs \
            --package-dir dist/packages \
            --out pages/portal/release-downloads.js \
            --version "${{ needs.version.outputs.version }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --git-sha "${{ needs.version.outputs.source_sha }}" \
            --group "${{ needs.version.outputs.tag }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: dist/packages
          if-no-files-found: error
          retention-days: 3

      - name: Build Pages portal
        run: bash pages/build.sh

      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pages-build
          path: pages/build
          if-no-files-found: error
          retention-days: 3

      - name: Upload GitHub Release assets
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag }}
          IS_PRERELEASE: ${{ needs.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/packages/* --clobber
          else
            gh release create "$TAG_NAME" dist/packages/* \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes \
              "${flags[@]}"
          fi

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs:
      - version
      - package
    if: needs.version.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Download Pages build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: pages-build
          path: pages/build

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages/build

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
