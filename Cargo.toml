[workspace]
resolver = "2"
members = ["crates/proto", "crates/agent-runtime", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["bojun.cbj"]

[workspace.dependencies]
proto = { path = "crates/proto" }
agent-runtime = { path = "crates/agent-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["connect"] }
url = "2"
dirs = "5"
toml = "0.8"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
unicode-width = "0.1"
which = "6"
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
