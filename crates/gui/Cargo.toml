[package]
name = "loom-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Loom desktop GUI client (Tauri)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
proto = { workspace = true }
agent-runtime = { workspace = true }
loom-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
# rfd: Native file dialog crate chosen over tauri-plugin-dialog because:
#   1. Lightweight — no Tauri plugin runtime dependency, works in standalone tests.
#   2. Cross-platform — uses native APIs (Win32 on Windows, NSPanel on macOS,
#      GTK on Linux) without extra system dependencies.
#   3. Decoupled — allows file dialogs outside Tauri command context if needed.
rfd = "0.15"

[features]
# Enabled by the Tauri production build so the bundled frontend is loaded via
# the embedded asset protocol instead of the Vite development server URL.
custom-protocol = ["tauri/custom-protocol"]
# Tauri 2 capability to open devtools, opt-in in dev builds.
devtools = ["tauri/devtools"]

[lints]
workspace = true
