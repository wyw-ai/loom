[package]
name = "loom-shell"
version.workspace = true
edition = "2021"
description = "Windows 管理 GUI — 通过托盘+标签页管理 loom-server / loom-daemon 服务"
license = "Apache-2.0"

# Only build on Windows; excluded from default-members so non-Windows
# `cargo check --workspace` won't try to resolve these deps.
[target.'cfg(windows)'.dependencies]
proto = { workspace = true }
loom-platform = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
native-windows-gui = "1.0.12"
native-windows-derive = "1.0.5"
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_Foundation",
] }

# Non-Windows stub target so `cargo check` can still resolve the crate name
[target.'cfg(not(windows))'.dependencies]

[lints]
workspace = true
