version: v0alpha1
kind: circuit
name: accepted-transfer

description: Ask whether another Actor accepts a handoff, resolve that request through Return, and commit Transfer only after acceptance.

uses: [call, return, branch, transfer, stop]

actors:
  sender: actor
  receiver: actor

memory:
  work_id: {store: durable}
  transfer_id: {store: durable}
  sender_handoff_scope: {store: durable}
  transferred_continuation: {store: durable}
  continuation_owner: {store: durable}
  handoff_context: {store: external}
  pending_acceptance_boundary: {store: durable}
  acceptance_completion_signal: {store: durable}
  acceptance_decision: {store: durable}

start: offer

steps:
  offer:
    gate: call
    input:
      caller: sender
      callee: receiver
      request: [work_id, transfer_id, handoff_context]
    with:
      mode: asynchronous
      delivery: store_and_forward
      activation: wakes
      match_by: [work_id, transfer_id]
    save:
      boundary_as: pending_acceptance_boundary
    then:
      opened: receive_acceptance

  receive_acceptance:
    gate: return
    input:
      pending_boundary: pending_acceptance_boundary
      completion_signal: acceptance_completion_signal
      work_result: acceptance_decision
    outcome: acceptance_completion_signal.outcome
    with:
      delivery: store_and_forward
      activation: wakes
      match_by: [work_id, transfer_id]
    save:
      work_result_as: acceptance_decision
    then:
      completed: decide
      partial: not_transferred
      failed: handoff_failed
      rejected: not_transferred
      cancelled: handoff_cancelled

  decide:
    gate: branch
    input:
      decision_context: acceptance_decision
      possible_paths: [commit, not_transferred]
    with:
      selection: one
      decision_method: rule
    then:
      accepted: commit
      rejected: not_transferred

  commit:
    gate: transfer
    input:
      current_owner: sender
      next_owner: receiver
      continuation: transferred_continuation
    save:
      continuation_owner_as: continuation_owner
    then:
      committed: close_sender_path

  close_sender_path:
    gate: stop
    input: {active_scope: sender_handoff_scope}
    with: {status: transferred}

  not_transferred:
    gate: stop
    input: {active_scope: sender_handoff_scope}
    with: {status: not_satisfied}

  handoff_failed:
    gate: stop
    input: {active_scope: sender_handoff_scope}
    with: {status: failed}

  handoff_cancelled:
    gate: stop
    input: {active_scope: sender_handoff_scope}
    with: {status: cancelled}

evaluation:
  freeze: [resolved_parameters, resolved_prompts, actor_bindings]
  record: [inputs, state_transitions, messages, decisions, outputs]

rules:
  - Delivery, acceptance, and ownership commitment are three different facts.
  - Call opens pending_acceptance_boundary; Return resolves it; Transfer commits only after the acceptance Branch authorizes it.
  - Every Stop in this Circuit terminates only sender_handoff_scope, not the sender's work continuation.
  - Stopping sender_handoff_scope never terminates transferred_continuation after receiver owns it.
  - Rejection, failure, or cancellation does not commit Transfer; the sender remains the owner of the work continuation.
