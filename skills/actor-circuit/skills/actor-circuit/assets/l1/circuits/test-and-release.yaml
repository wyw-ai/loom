version: v0alpha1
kind: circuit
name: test-and-release

description: Open explicit Call boundaries for testing and release, resolve each through Return, and branch on the retained test result.

instance_of: [pipeline]

uses: [call, return, branch, stop]

actors:
  builder: agent_or_human
  test_runner: service
  release_service: service

memory:
  circuit_scope: {store: durable}
  work_id: {store: durable}
  change_ref: {store: external}
  pending_test_boundary: {store: ephemeral}
  test_completion_signal: {store: durable}
  test_completion_outcome: {store: durable}
  test_result: {store: durable}
  pending_release_boundary: {store: ephemeral}
  release_completion_signal: {store: durable}
  release_completion_outcome: {store: durable}
  release_result: {store: durable}

start: open_test_call

steps:
  open_test_call:
    gate: call
    input:
      caller: builder
      callee: test_runner
      request: [work_id, change_ref]
    with:
      mode: synchronous
      delivery: immediate
      activation: wakes
      match_by: [work_id]
    save:
      boundary_as: pending_test_boundary
    then:
      opened: receive_test_return

  receive_test_return:
    gate: return
    input:
      pending_boundary: pending_test_boundary
      completion_signal: test_completion_signal
      work_result: test_result
    outcome: test_completion_signal.outcome
    with:
      delivery: immediate
      activation: wakes
      match_by: [work_id]
    save:
      completion_signal_as: test_completion_signal
      completion_outcome_as: test_completion_outcome
      work_result_as: test_result
    then:
      completed: check_tests
      partial: test_not_satisfied
      failed: test_failed
      rejected: test_failed
      cancelled: test_failed

  check_tests:
    gate: branch
    input:
      decision_context: test_result
      possible_paths: [release, revision_required]
    with:
      selection: one
      decision_method: rule
    then:
      passed: open_release_call
      failed: revision_required

  open_release_call:
    gate: call
    input:
      caller: builder
      callee: release_service
      request: [work_id, change_ref]
    with:
      mode: synchronous
      delivery: immediate
      activation: wakes
      match_by: [work_id]
    save:
      boundary_as: pending_release_boundary
    then:
      opened: receive_release_return

  receive_release_return:
    gate: return
    input:
      pending_boundary: pending_release_boundary
      completion_signal: release_completion_signal
      work_result: release_result
    outcome: release_completion_signal.outcome
    with:
      delivery: immediate
      activation: wakes
      match_by: [work_id]
    save:
      completion_signal_as: release_completion_signal
      completion_outcome_as: release_completion_outcome
      work_result_as: release_result
    then:
      completed: released
      partial: release_failed
      failed: release_failed
      rejected: release_failed
      cancelled: release_failed

  released:
    gate: stop
    input: {active_scope: circuit_scope}
    with: {status: succeeded}

  revision_required:
    gate: stop
    input: {active_scope: circuit_scope}
    with: {status: needs_revision}

  test_not_satisfied:
    gate: stop
    input: {active_scope: circuit_scope}
    with: {status: not_satisfied}

  test_failed:
    gate: stop
    input: {active_scope: circuit_scope}
    with: {status: failed}

  release_failed:
    gate: stop
    input: {active_scope: circuit_scope}
    with: {status: failed}

evaluation:
  freeze: [resolved_parameters, resolved_prompts, actor_bindings]
  record: [inputs, state_transitions, messages, decisions, outputs]

rules:
  - Each Call opens a Boundary State and each Return resolves exactly that boundary.
  - Completion signals and work results remain separate facts.
  - Each Return binds its structural outcome from the matching completion signal, not from the work result.
  - Branch reads the retained test result; it does not infer success from Return silence.
  - Every Stop terminates circuit_scope and no larger implicit scope.
